plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fifa11.port'
    compileSdk 35

    defaultConfig {
        applicationId "com.fifa11.port"
        minSdk 21 // Soporte base para Android 5, 9 y 15
        targetSdk 35
        versionCode 1
        versionName "1.0-unstable"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters 'armeabi-v7a', 'arm64-v8a' // 32 bits (Android 5/9) y 64 bits (Android 15)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}